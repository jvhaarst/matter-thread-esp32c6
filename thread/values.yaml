# OpenThread border routers: one pod on every node that matches nodeSelector, using the one
# radio plugged into that node.
otbr:
  # ownbee/hass-otbr-docker repackages the Home Assistant OTBR app, so the REST API is the one
  # Home Assistant is tested against. Pinned by tag and digest; Renovate keeps both current.
  image: ghcr.io/ownbee/hass-otbr-docker:v0.5.0@sha256:2f927f06f803c5dd16f97f8aad752c53d92e2c3b1de90fe4273f278fc6cc8206
  backboneInterface: eth0
  # Home Assistant's OTBR integration and the Matter server's Thread diagnostics both expect 8081.
  restPort: 8081
  logLevel: notice
  # Thread credentials stay on the node that holds the radio, never on a network volume.
  stateHostPath: /var/lib/otbr
  # Which nodes are border routers. Label a node thread-br=true (after installing the IPv6
  # forwarding sysctl from nodes/60-otbr.conf on it) to add one.
  nodeSelector:
    thread-br: "true"
  # The radio as /dev/serial/by-id names it; each border-router node must have exactly one
  # device that matches and answers as an OpenThread radio.
  radioPattern: usb-Espressif_USB_JTAG_serial_debug_unit_*-if00
  # Name the radio for a node explicitly, as `ls /dev/serial/by-id` shows it on that node,
  # e.g. for a node with two radios or a radio the pattern does not match. It must still
  # answer as an OpenThread radio. Changing this rolls the border routers one node at a time.
  #   radioOverrides:
  #     raspi5: usb-Espressif_USB_JTAG_serial_debug_unit_90:64:9B:AB:3F:98-if00
  radioOverrides: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

matterServer:
  image: ghcr.io/matter-js/matterjs-server:1.6.1@sha256:5591f9f65926ca4b13b34cfd9c9888cb9d9ee9f147fe0b04c8e025cbeeee0eb7
  primaryInterface: eth0
  # Behind Traefik the dashboard cannot tell from the URL that the server itself serves it,
  # and asks for a server address. This makes it use the URL it was loaded from.
  productionMode: true
  # Runs on any border-router node (label thread-br=true, the same label the border routers
  # select on): there it reaches the Thread network through the node's own wpan0, and every
  # such node is a Raspberry Pi whose uplink is primaryInterface.
  nodeSelector:
    thread-br: "true"
  # The Matter fabric: keys and the list of commissioned devices. Losing it means every
  # device has to be factory-reset and commissioned again. The claim is kept when the release
  # is uninstalled. A PVC's storage class cannot change and its size can only grow (and only
  # where the class allows expansion): changing either here makes the App upgrade fail, without
  # touching the data.
  storage:
    size: 1Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # The dashboard under a name that follows the pod. lan-only@file is the allowlist the
  # Traefik allowlist updater maintains: the LAN, the pod and service networks, the home WAN
  # address (where LAN clients appear from through the public name), and one external range.
  # There is no login: anyone it admits can add and remove devices.
  ingress:
    enabled: true
    host: matter.vanhaarst.net
    middlewares: lan-only@file
    clusterIssuer: letsencrypt-production
    tlsSecret: matter-server-tls
