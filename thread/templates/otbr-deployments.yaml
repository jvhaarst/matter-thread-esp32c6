{{- range .Values.borderRouters }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otbr-{{ .node }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "thread.labels" $ | nindent 4 }}
    app.kubernetes.io/name: otbr
    thread-br/node: {{ .node }}
spec:
  replicas: 1
  # The radio and the Thread state exist once per node, so the old pod must be gone before
  # the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: otbr
      thread-br/node: {{ .node }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otbr
        thread-br/node: {{ .node }}
    spec:
      # Thread border routing, mDNS and TREL all work on the LAN itself.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: {{ .node }}
        thread-br: "true"
      terminationGracePeriodSeconds: 30
      containers:
        - name: otbr
          image: {{ .image | default $.Values.otbr.image }}
          securityContext:
            # Required, not a convenience: a container may only open a host character
            # device (the radio) when the device cgroup allows it, and without a device
            # plugin only a privileged container gets that. It also covers /dev/net/tun and
            # the ip6tables/ipset setup. A privileged container gets the host's device nodes
            # at creation, which is where the by-id symlink points (../../ttyACM0).
            privileged: true
          env:
            - name: DEVICE
              value: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_{{ required (printf "borderRouters: radioMac is required for %s" .node) .radioMac | upper }}-if00
            # Meaningless on USB CDC, but otbr-agent wants a number.
            - name: BAUDRATE
              value: "460800"
            - name: FLOW_CONTROL
              value: "0"
            - name: BACKBONE_IF
              value: {{ $.Values.otbr.backboneInterface }}
            - name: OTBR_REST_PORT
              value: {{ $.Values.otbr.restPort | quote }}
            - name: OTBR_WEB
              value: "0"
            - name: FIREWALL
              value: "1"
            # The LAN has global IPv6, and NAT64 would add NAT rules next to k3s's own.
            - name: NAT64
              value: "0"
            # Only for Silicon Labs radios.
            - name: AUTOFLASH_FIRMWARE
              value: "0"
            - name: OTBR_LOG_LEVEL
              value: {{ $.Values.otbr.logLevel }}
          ports:
            - name: rest
              containerPort: {{ $.Values.otbr.restPort }}
              hostPort: {{ $.Values.otbr.restPort }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: rest
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: rest
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: rest
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml $.Values.otbr.resources | nindent 12 }}
          volumeMounts:
            - name: radio
              mountPath: /dev/serial/by-id
              readOnly: true
            - name: state
              mountPath: /data
      volumes:
        # The directory of symlinks, never the radio's own path. With the device itself as
        # hostPath, the container runtime creates a directory in its place when a restart
        # finds the radio unplugged, and udev can then no longer create the symlink when the
        # radio comes back.
        - name: radio
          hostPath:
            path: /dev/serial/by-id
            type: Directory
        - name: state
          hostPath:
            path: {{ $.Values.otbr.stateHostPath }}
            type: DirectoryOrCreate
{{- end }}
