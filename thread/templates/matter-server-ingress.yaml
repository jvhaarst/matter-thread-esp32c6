{{- with .Values.matterServer.ingress }}
{{- if .enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matter-server
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "thread.labels" $ | nindent 4 }}
    app.kubernetes.io/name: matter-server
  annotations:
    cert-manager.io/cluster-issuer: {{ .clusterIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .middlewares }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: matter-server
                port:
                  name: ws
  tls:
    - hosts:
        - {{ .host }}
      secretName: {{ .tlsSecret }}
{{- end }}
{{- end }}
