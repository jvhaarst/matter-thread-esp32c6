# One OpenThread border router on every node labelled thread-br=true, each with the one USB
# radio plugged into that node. Adding a border router is labelling a node; the chart does not
# change.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otbr
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thread.labels" . | nindent 4 }}
    app.kubernetes.io/name: otbr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otbr
  # Upgrades go one node at a time, and the next node only after the replaced router has been
  # Ready (back in the mesh, see the readiness probe) for minReadySeconds, so the network always
  # keeps the other border routers. maxSurge must stay 0: the radio and port 8081 exist once per
  # node, so a second pod on the same node could never start.
  #
  # otbr.updateStrategy OnDelete stops the DaemonSet from replacing pods by itself, for trying a
  # new image on one node first: upgrade, delete one node's otbr pod, watch it, then the others.
  updateStrategy:
    {{- if eq .Values.otbr.updateStrategy "RollingUpdate" }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
    {{- else if eq .Values.otbr.updateStrategy "OnDelete" }}
    type: OnDelete
    {{- else }}
    {{- fail (printf "otbr.updateStrategy must be RollingUpdate or OnDelete, not %q" .Values.otbr.updateStrategy) }}
    {{- end }}
  minReadySeconds: 60
  template:
    metadata:
      annotations:
        # Changes with the scripts the pods run and with the radio overrides, so either change
        # rolls out node by node instead of waiting for whatever restarts a pod next. Hashes the
        # files and values themselves, not the rendered ConfigMap, whose labels carry the chart
        # version: an upgrade that changes neither restarts nothing.
        thread.otbr/config: {{ printf "%s\n%s\n%s" (.Files.Get "files/link-radio.sh") (.Files.Get "files/probe-radio.py") (toJson .Values.otbr.radioOverrides) | sha256sum | trunc 16 }}
      labels:
        app.kubernetes.io/name: otbr
    spec:
      # Thread border routing, mDNS and TREL all work on the LAN itself.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        {{- toYaml .Values.otbr.nodeSelector | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: otbr
          image: {{ .Values.otbr.image }}
          # Finds this node's radio, links it to DEVICE, then runs the image's /init.
          command:
            - /opt/thread/link-radio.sh
          securityContext:
            # Required, not a convenience: a container may only open a host character
            # device (the radio) when the device cgroup allows it, and without a device
            # plugin only a privileged container gets that. It also covers /dev/net/tun and
            # the ip6tables/ipset setup. A privileged container gets the host's device nodes
            # at creation, which is where the by-id symlinks point (../../ttyACM0).
            privileged: true
          env:
            - name: RADIO_PATTERN
              value: {{ .Values.otbr.radioPattern | quote }}
            - name: RADIO_OVERRIDES
              value: /opt/thread/radio-overrides
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DEVICE
              value: /dev/ttyOTBR
            # Meaningless on USB CDC, but otbr-agent wants a number.
            - name: BAUDRATE
              value: "460800"
            - name: FLOW_CONTROL
              value: "0"
            - name: BACKBONE_IF
              value: {{ .Values.otbr.backboneInterface }}
            - name: OTBR_REST_PORT
              value: {{ .Values.otbr.restPort | quote }}
            - name: OTBR_WEB
              value: "0"
            - name: FIREWALL
              value: "1"
            # The LAN has global IPv6, and NAT64 would add NAT rules next to k3s's own.
            - name: NAT64
              value: "0"
            # Only for Silicon Labs radios.
            - name: AUTOFLASH_FIRMWARE
              value: "0"
            - name: OTBR_LOG_LEVEL
              value: {{ .Values.otbr.logLevel }}
          ports:
            - name: rest
              containerPort: {{ .Values.otbr.restPort }}
              hostPort: {{ .Values.otbr.restPort }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: rest
            periodSeconds: 5
            failureThreshold: 60
          # Ready means "in the Thread mesh", not just "REST port open"; the rolling update waits
          # for it. A router that is briefly detached only drops out of Ready, it is not restarted.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - ot-ctl state | grep -q -E '^(child|router|leader)'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: rest
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.otbr.resources | nindent 12 }}
          volumeMounts:
            - name: radio
              mountPath: /dev/serial/by-id
              readOnly: true
            - name: state
              mountPath: /data
            - name: scripts
              mountPath: /opt/thread
              readOnly: true
      volumes:
        # The directory of symlinks, never the radio's own path. With the device itself as
        # hostPath, the container runtime creates a directory in its place when a restart
        # finds the radio unplugged, and udev can then no longer create the symlink when the
        # radio comes back.
        - name: radio
          hostPath:
            path: /dev/serial/by-id
            type: Directory
        - name: state
          hostPath:
            path: {{ .Values.otbr.stateHostPath }}
            type: DirectoryOrCreate
        - name: scripts
          configMap:
            name: otbr-scripts
            defaultMode: 0555
