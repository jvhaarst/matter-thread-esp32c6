name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'thread/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5

      # The same checks as the lint workflow: a direct push by an admin bypasses the required
      # check, and must not publish a chart nobody linted.
      - name: Check tools
        run: |
          yq --version | grep -q 'mikefarah/yq.* v4\.'
          jq --version

      - name: Lint chart
        run: helm lint thread

      - name: Invariants
        run: tests/invariants.sh

      - name: Package Helm chart
        run: |
          mkdir -p .helm-release
          BASE_VERSION=$(grep '^version:' thread/Chart.yaml | awk '{print $2}')
          NEW_VERSION="${BASE_VERSION%.*}.${{ github.run_number }}"
          echo "Publishing chart version $NEW_VERSION"
          helm package thread -d .helm-release --version "$NEW_VERSION"

      # deploy-pages replaces the whole site, so the earlier archives have to be uploaded again
      # or they disappear while an index would still list them.
      - name: Collect the published archives
        run: .github/scripts/collect-published-charts.sh "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" .helm-release

      - name: Generate Helm repo index
        run: helm repo index .helm-release --url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.helm-release'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
