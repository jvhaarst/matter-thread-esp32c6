name: Lint Helm Chart

# On every pull request, without a paths filter: the ruleset requires the check "lint", and
# a required check that never runs leaves a pull request waiting forever.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      # tests/invariants.sh needs mikefarah yq v4 and jq; both ship with the runner image.
      - name: Check tools
        run: |
          yq --version | grep -q 'mikefarah/yq.* v4\.'
          jq --version

      - name: Lint chart
        run: helm lint thread

      - name: Render templates
        run: helm template thread thread --namespace thread

      - name: Invariants
        run: tests/invariants.sh
