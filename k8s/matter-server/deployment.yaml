apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  labels:
    app.kubernetes.io/name: matter-server
spec:
  replicas: 1
  # One controller per fabric, and the volume is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter-server
    spec:
      # Matter uses link-local IPv6 multicast and mDNS, which do not cross the
      # pod network.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Same nodes as Home Assistant. Both are Raspberry Pis whose uplink is eth0.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - raspi5
                      - raspi-k3s2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: matter-server
          image: ghcr.io/matter-js/matterjs-server:1.6.0@sha256:9eb98c839d0b4b07f9230b96ad52de570f7f2a7c286c5992b4c04b6b26c08a3f
          env:
            - name: PRIMARY_INTERFACE
              value: eth0
          ports:
            - name: ws
              containerPort: 5580
              hostPort: 5580
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: ws
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: ws
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ws
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matter-server
        - name: tmp
          emptyDir: {}
