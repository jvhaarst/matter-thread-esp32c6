# A stable name for Home Assistant, which runs on the pod network:
# ws://matter-server.thread.svc.cluster.local:5580/ws
# The pod uses host networking, so the endpoint is the IP of whichever node runs it.
apiVersion: v1
kind: Service
metadata:
  name: matter-server
  labels:
    app.kubernetes.io/name: matter-server
spec:
  selector:
    app.kubernetes.io/name: matter-server
  ports:
    - name: ws
      port: 5580
      targetPort: ws
      protocol: TCP
