# The Matter fabric: keys and the list of commissioned devices. Losing it means
# every device has to be factory-reset and commissioned again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matter-server
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
