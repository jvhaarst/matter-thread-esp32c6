# Namespace for the Rancher App `thread` (chart in ../thread). Not part of the chart: Rancher
# installs into an existing namespace, and the namespace must outlive the App.
apiVersion: v1
kind: Namespace
metadata:
  name: thread
  labels:
    # The border router needs host networking and a privileged container.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
