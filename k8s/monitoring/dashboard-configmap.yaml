apiVersion: v1
kind: ConfigMap
metadata:
  name: thread-border-routers-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  thread-border-routers.json: |
    {
      "uid": "thread-border-routers",
      "title": "Thread border routers",
      "tags": [
        "thread",
        "otbr",
        "matter",
        "victorialogs"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "5m",
      "timezone": "browser",
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "RCP trouble lines",
          "description": "Lines in the OTBR logs that mean the radio link failed or was reset, in the selected time range. Zero is the healthy value.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "queryType": "stats",
              "expr": "kubernetes.pod_namespace:thread kubernetes.container_name:otbr (\"RCP failure detected\" OR \"Unexpected RCP reset\" OR \"radio tx timeout\" OR \"Init() at spinel_driver\" OR \"WARNING: otbr-agent exited\") | stats count() events"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Container restarts",
          "description": "Restarts of all containers in namespace thread in the selected time range. Counts restarts of an existing pod only; a pod that was replaced starts again at zero.",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "editorMode": "code",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"thread\"}[$__range]))",
              "legendFormat": "restarts",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pods ready",
          "description": "Expect 4: three border routers and the Matter server. Raise the threshold here and in the alert rule when a pod is added.",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "editorMode": "code",
              "expr": "sum(kube_pod_status_ready{namespace=\"thread\",condition=\"true\"})",
              "legendFormat": "ready",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 4
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Thread role changes",
          "description": "Role transitions logged by the border routers (leader, router, child, detached). A few at start-up are normal; a steady stream means an unstable mesh.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "queryType": "stats",
              "expr": "kubernetes.pod_namespace:thread kubernetes.container_name:otbr \"Role \" | stats count() changes"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "RCP trouble lines per node",
          "description": "Same filter as the stat above, per border-router node over time.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "queryType": "statsRange",
              "expr": "kubernetes.pod_namespace:thread kubernetes.container_name:otbr (\"RCP failure detected\" OR \"Unexpected RCP reset\" OR \"radio tx timeout\" OR \"Init() at spinel_driver\" OR \"WARNING: otbr-agent exited\") | stats by (kubernetes.pod_node_name) count() events",
              "legendFormat": "{{kubernetes.pod_node_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                }
              },
              "min": 0,
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Container restarts per pod",
          "description": "Restart counter per pod. A step up is one restart.",
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"thread\"})",
              "legendFormat": "{{pod}}",
              "instant": false,
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "fillOpacity": 0
              },
              "min": 0,
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "type": "logs",
          "title": "RCP trouble lines",
          "description": "The matching lines themselves, newest first.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "queryType": "logs",
              "expr": "kubernetes.pod_namespace:thread kubernetes.container_name:otbr (\"RCP failure detected\" OR \"Unexpected RCP reset\" OR \"radio tx timeout\" OR \"Init() at spinel_driver\" OR \"WARNING: otbr-agent exited\")"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        },
        {
          "id": 8,
          "type": "logs",
          "title": "Thread role changes",
          "description": "",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "queryType": "logs",
              "expr": "kubernetes.pod_namespace:thread kubernetes.container_name:otbr \"Role \""
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        },
        {
          "id": 9,
          "type": "logs",
          "title": "USB events for the radios (host kernel log)",
          "description": "From the journals of the three border-router nodes. A disconnect followed by a new cdc_acm line is a replug or a USB reset. The filter also matches other USB devices that disconnect.",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "x": 12,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "queryType": "logs",
              "expr": "host:~\"raspi5|raspi-k3s|raspi-k3s2\" unit:kernel (\"idVendor=303a\" OR \"cdc_acm\" OR \"USB disconnect\")"
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        }
      ]
    }
